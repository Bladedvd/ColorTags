
name: Build ColorTags

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compilar executavel
        run: dotnet publish .\ColorTags\ColorTags.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Disponibilizar executavel
        uses: actions/upload-artifact@v4
        with:
          name: ColorTags-Windows-x64
          path: ColorTags\bin\Release\net8.0-windows\win-x64\publish\
          if-no-files-found: error
